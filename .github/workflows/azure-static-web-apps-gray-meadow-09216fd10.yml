name: Deploy Jarvis

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - '.github/workflows/azure-static-web-apps-gray-meadow-09216fd10.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jarvis-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify Guitar release assets
        run: |
          for asset in public/guitar/render-worker.js public/guitar/pdf.js public/guitar/vendor/Bravura.otf; do
            test -s "$asset" || { echo "Missing or empty release asset: $asset"; exit 1; }
          done
          node --check public/guitar/render-worker.js
          node --check public/guitar/pdf.js
      - name: Configure shared Quick AI
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node scripts/configure-quick-ai.mjs public
      - name: Configure shared Drive
        env:
          GOOGLE_DRIVE_API_KEY: ${{ secrets.GOOGLE_DRIVE_API_KEY }}
        run: node scripts/configure-drive.mjs public
      - name: Deploy static shell
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GRAY_MEADOW_09216FD10 }}
          action: upload
          app_location: public
          api_location: ''
          output_location: ''
          skip_app_build: true
          skip_api_build: true
