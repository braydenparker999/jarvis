name: Validate R2 migration and playback

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Superseded PR validation can stop. Main runs have unique groups and never
# cancel one another; deployment concurrency is unchanged in its own workflows.
concurrency:
  group: r2-validation-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned test dependencies
        run: npm ci
      - name: Verify complete test inventory and mandatory Chromium
        run: |
          export JARVIS_CHROME="$(command -v google-chrome || command -v chromium)"
          test -n "$JARVIS_CHROME"
          printf 'JARVIS_CHROME=%s\n' "$JARVIS_CHROME" >> "$GITHUB_ENV"
          node tests/helpers/ci-test-inventory.mjs check > "$RUNNER_TEMP/ci-test-inventory.json"
          cat "$RUNNER_TEMP/ci-test-inventory.json"
          node --input-type=module -e 'import {requireBrowser} from "./tests/helpers/ci-test-inventory.mjs"; requireBrowser()'
      - name: Run fast Relay contracts and real OAuth consent browser
        run: node tests/helpers/ci-test-inventory.mjs run relay --require-browser
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check migration syntax and integrity tests
        run: |
          python -m py_compile scripts/migrate-drive-to-r2.py
          test -f tests/test_r2_migration.py
          python -m unittest discover -s tests -p 'test_r2*.py' -v
      - name: Trace isolated unchanged Poweramp rendering
        if: ${{ !cancelled() }}
        env:
          POWERAMP_EVIDENCE_DIR: ${{ runner.temp }}/poweramp-browser
        run: |
          export JARVIS_CHROME="$(command -v google-chrome || command -v chromium)"
          test -n "$JARVIS_CHROME"
          node --check tests/poweramp-render-trace-browser.mjs
          node --test tests/poweramp-render-trace-browser.mjs
      - name: Preserve isolated Poweramp render traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poweramp-render-trace-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/poweramp-browser/render-trace-summary.json
            ${{ runner.temp }}/poweramp-browser/render-trace-*-report.json
            ${{ runner.temp }}/poweramp-browser/render-trace-*-timings.json
            ${{ runner.temp }}/poweramp-browser/render-trace-*-events.json.gz
            ${{ runner.temp }}/poweramp-browser/render-visual-*.png
            ${{ runner.temp }}/poweramp-browser/render-baked-backdrop-*.png
            ${{ runner.temp }}/poweramp-browser/render-layer-pictures-*.json
          if-no-files-found: warn
          retention-days: 14
      - name: Measure persistent live-node Poweramp prototype
        if: ${{ !cancelled() }}
        env:
          POWERAMP_EVIDENCE_DIR: ${{ runner.temp }}/poweramp-browser
          POWERAMP_BASELINE_REF: 8aa7fce4dd83d5417614ae112134631dd98df7b6
        run: |
          export JARVIS_CHROME="$(command -v google-chrome || command -v chromium)"
          test -n "$JARVIS_CHROME"
          node --test tests/poweramp-persistent-prototype-browser.mjs
      - name: Verify actual library visibility after mini round trips
        if: ${{ !cancelled() }}
        env:
          POWERAMP_EVIDENCE_DIR: ${{ runner.temp }}/poweramp-browser
        run: |
          export JARVIS_CHROME="$(command -v google-chrome || command -v chromium)"
          test -n "$JARVIS_CHROME"
          node tests/helpers/ci-test-inventory.mjs run blankLibrary --require-browser
      - name: Run frontend regression tests
        if: ${{ !cancelled() }}
        env:
          POWERAMP_EVIDENCE_DIR: ${{ runner.temp }}/poweramp-browser
        run: |
          export JARVIS_CHROME="$(command -v google-chrome || command -v chromium)"
          test -n "$JARVIS_CHROME"
          node tests/helpers/ci-test-inventory.mjs run regressions --require-browser
      - name: Measure isolated cold and playing Poweramp input setup
        if: ${{ !cancelled() }}
        env:
          POWERAMP_EVIDENCE_DIR: ${{ runner.temp }}/poweramp-browser
        run: |
          export JARVIS_CHROME="$(command -v google-chrome || command -v chromium)"
          test -n "$JARVIS_CHROME"
          node --test tests/poweramp-preview-setup-browser.mjs
      - name: Preserve Poweramp trusted-input evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poweramp-browser-${{ github.run_id }}
          path: ${{ runner.temp }}/poweramp-browser
          if-no-files-found: warn
          retention-days: 14
      - name: Verify podcast listening and offline playback in Chromium
        run: |
          export JARVIS_CHROME="$(command -v google-chrome || command -v chromium)"
          test -n "$JARVIS_CHROME"
          export JARVIS_SCREENSHOT_DIR="$RUNNER_TEMP/podcast-screenshots"
          node tests/helpers/ci-test-inventory.mjs run podcasts --require-browser
      - name: Preserve podcast browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: podcast-browser-${{ github.run_id }}
          path: ${{ runner.temp }}/podcast-screenshots
          if-no-files-found: ignore
          retention-days: 14
      - name: Preserve exact test coverage inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-test-inventory-${{ github.run_id }}
          path: ${{ runner.temp }}/ci-test-inventory.json
          if-no-files-found: warn
          retention-days: 14
