name: Validate R2 migration and playback

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned test dependencies
        run: npm ci
      - name: Run frontend regression tests
        env:
          POWERAMP_EVIDENCE_DIR: ${{ runner.temp }}/poweramp-browser
        run: |
          export JARVIS_CHROME="$(command -v google-chrome || command -v chromium)"
          test -n "$JARVIS_CHROME"
          npm test
      - name: Preserve Poweramp trusted-input evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poweramp-browser-${{ github.run_id }}
          path: ${{ runner.temp }}/poweramp-browser
          if-no-files-found: warn
          retention-days: 14
      - name: Verify podcast listening and offline playback in Chromium
        run: |
          export JARVIS_CHROME="$(command -v google-chrome || command -v chromium)"
          test -n "$JARVIS_CHROME"
          export JARVIS_SCREENSHOT_DIR="$RUNNER_TEMP/podcast-screenshots"
          node --test tests/podcasts-browser.test.js
      - name: Preserve podcast browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: podcast-browser-${{ github.run_id }}
          path: ${{ runner.temp }}/podcast-screenshots
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check migration syntax and integrity tests
        run: |
          python -m py_compile scripts/migrate-drive-to-r2.py
          test -f tests/test_r2_migration.py
          python -m unittest discover -s tests -p 'test_r2*.py' -v
