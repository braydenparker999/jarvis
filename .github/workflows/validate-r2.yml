name: Validate R2 migration and playback

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run frontend regression tests
        run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check migration syntax and integrity tests
        run: |
          python -m py_compile scripts/migrate-drive-to-r2.py
          test -f tests/test_r2_migration.py
          python -m unittest discover -s tests -p 'test_r2_migration.py' -v
