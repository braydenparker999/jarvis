<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0a0908">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="drawercast-build" content="server-waveforms-r11">
<title>DrawerCast Player</title>
<style>
/* ============================ RESET / BASE ============================ */
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;padding:0;overflow:hidden;overscroll-behavior:none}
body{
  font-family:var(--font-stack);
  font-size:calc(16px * var(--font-scale));
  background:#000;color:var(--txt);
  font-weight:700;
  -webkit-font-smoothing:antialiased;
  user-select:none;-webkit-user-select:none;
  touch-action:manipulation;
}
button,input,select,textarea{font:inherit;color:inherit;background:none;border:0;outline:none}
button{cursor:pointer}
img{display:block;max-width:100%}
svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;overflow:visible}
svg[fill="currentColor"]{fill:currentColor;stroke:none}
:root{
  --font-stack:"Inter","Roboto",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-alt:"Georgia","Times New Roman",serif;
  /* dynamic palette (recomputed from album art) */
  --accent:#f2e0cf;
  --accent-dim:#c8b6a6;
  --txt:#f2e0cf;
  --txt-dim:rgba(242,224,207,.62);
  --chip:rgba(30,24,20,.82);
  --chip-hi:rgba(58,46,38,.92);
  --surface:rgba(20,16,14,.96);
  --surface-2:rgba(38,30,25,.97);
  --line:rgba(255,255,255,.09);
  --bg0:#0a0908;
  --shadow:0 12px 34px rgba(0,0,0,.55);
  --r-lg:30px; --r-md:22px; --r-sm:14px;
  --row-h:82px; --row-art:66px; --row-pad:8px;
  --font-scale:1;
  --card-r:26px;
  --nav-h:64px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
  --blue:#3b82f6;
  --anim:1;
  --dur-fast:calc(140ms * var(--anim));
  --dur:calc(260ms * var(--anim));
  --dur-slow:calc(420ms * var(--anim));
  --ease:cubic-bezier(.22,.61,.36,1);
  --ease-out:cubic-bezier(.16,1,.3,1);
}
body.theme-light .cbtn{background:rgba(255,255,255,.86)}
body.theme-light .rate button,body.theme-light .artmore{background:rgba(255,255,255,.82)}
body.theme-light #bg-vig{background:radial-gradient(120% 80% at 50% 40%,transparent 40%,rgba(255,255,255,.5) 100%)}
body.theme-light .vslide .thumb{background:#f6f2ee}
body.theme-light .knob{background:#efe9e3}
body.theme-light .pill{background:#efe9e3;color:#221c17}
body.font-alt{--font-stack:var(--font-alt)}
body.font-bold{font-weight:800}
body.font-boldplus{font-weight:900;letter-spacing:.2px}
body.no-anim{--anim:0.0001}
body.dens-compact{--row-h:64px;--row-art:48px;--row-pad:5px}
body.dens-normal{--row-h:82px;--row-art:66px;--row-pad:8px}
body.dens-large{--row-h:98px;--row-art:80px;--row-pad:11px}
body.dens-compact .t3{display:none}
body.no-rating .rate{display:none}
body.no-cast .artcast{display:none}
body.no-seek .seekrow{display:none}
body.seek-wave .seek{display:none}
body.seek-wave .seekrow{justify-content:space-between;padding-top:0}
body.seek-wave .timepill{background:transparent;padding:2px 6px;color:var(--txt-dim)}
#transport{cursor:pointer}

body.no-outinfo .outinfo{display:none}
body.tr-small{--btn-lg:clamp(58px,8.6vh,72px);--btn-sm:clamp(40px,5.8vh,50px);--btn-xs:clamp(30px,4.4vh,38px)}
body.tr-normal{--btn-lg:clamp(84px,12.4vh,104px);--btn-sm:clamp(54px,8.4vh,70px);--btn-xs:clamp(40px,6.2vh,52px)}
body.tr-large{--btn-lg:clamp(108px,16.5vh,138px);--btn-sm:clamp(76px,11vh,94px);--btn-xs:clamp(56px,8vh,70px)}
body.tr-small .ctrls{gap:10px}
body.tr-large .ctrls{gap:2px}

/* ============================ BACKGROUND ============================ */
#bg{position:fixed;inset:0;z-index:0;background:var(--bg0);overflow:hidden}
#bg-art,#bg-art-next{
  position:absolute;inset:-14%;
  background-size:cover;background-position:center;
  filter:blur(var(--bg-blur,16px)) saturate(var(--bg-sat,150%)) brightness(var(--bg-int,1));
  transform:scale(1.25);
  image-rendering:auto;
  transition:opacity var(--dur-slow) var(--ease);
  will-change:opacity;
}
#bg-art-next{opacity:0}
#bg-grad{
  position:absolute;inset:0;
  background:linear-gradient(180deg,
    color-mix(in srgb,var(--grad-color,#000) 0%,transparent) 0%,
    color-mix(in srgb,var(--grad-color,#000) calc(var(--grad-strength,40) * 1%),transparent) 55%,
    color-mix(in srgb,var(--grad-color,#000) calc(var(--grad-strength,40) * 1.9%),transparent) 100%);
  pointer-events:none;
}
#bg-vig{position:absolute;inset:0;background:radial-gradient(120% 80% at 50% 40%,transparent 40%,rgba(0,0,0,.55) 100%);pointer-events:none}
#bg-dim{position:absolute;inset:0;background:var(--dim-color,#000);opacity:0;pointer-events:none;transition:opacity var(--dur) var(--ease)}
#bg-dim.on{opacity:.66}
#bg-dim.full{opacity:.94}
body.no-bg #bg-art,body.no-bg #bg-art-next{display:none}

/* ============================ APP FRAME ============================ */
#app{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column}
.screen{
  position:absolute;inset:0;
  display:flex;flex-direction:column;
  padding-top:var(--safe-t);
  transition:transform var(--dur) var(--ease),opacity var(--dur) var(--ease);
  will-change:transform,opacity;
}
.screen[hidden]{display:none}
.screen.enter-up{transform:translateY(6%);opacity:0}
.screen.leave-down{transform:translateY(6%);opacity:0}
.screen.enter-right{transform:translateX(14%);opacity:0}
.screen.leave-left{transform:translateX(-9%);opacity:0}

/* ============================ TOP BAR ============================ */
.topbar{
  display:flex;align-items:center;gap:6px;
  padding:10px 8px 6px;min-height:56px;flex:0 0 auto;
}
.topbar h1{font-size:26px;margin:0 6px;flex:1;letter-spacing:-.5px;font-weight:800}
.topbar.sub h1{font-size:22px}
.iconbtn{
  width:44px;height:44px;border-radius:50%;
  display:grid;place-items:center;flex:0 0 auto;
  transition:background var(--dur-fast) var(--ease),transform var(--dur-fast) var(--ease);
}
.iconbtn:active{background:rgba(255,255,255,.12);transform:scale(.92)}
.iconbtn.ring{border:1.6px solid var(--txt-dim)}
.iconbtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.iconbtn.filled svg{fill:currentColor;stroke:none}

/* ============================ SCROLL AREAS ============================ */
.scroll{
  flex:1 1 auto;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding-bottom:calc(var(--nav-h) + var(--safe-b) + 116px);
  scrollbar-width:thin;
}
.scroll::-webkit-scrollbar{width:4px}
.scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.22);border-radius:4px}

/* ============================ LIBRARY CATEGORIES ============================ */
.catrow{
  display:flex;align-items:center;gap:16px;padding:11px 18px;
  transition:background var(--dur-fast) var(--ease);
}
.catrow:active{background:rgba(255,255,255,.07)}
.catico{
  width:52px;height:52px;border-radius:50%;flex:0 0 auto;
  display:grid;place-items:center;box-shadow:0 2px 10px rgba(0,0,0,.4);
}
.catico svg{width:26px;height:26px}
.catrow .lbl{font-size:calc(19px * var(--font-scale));font-weight:800}
.catrow .cnt{margin-left:auto;font-size:13px;color:var(--txt-dim);font-weight:700}

/* ============================ TRACK LIST ============================ */
.list{padding:2px 0}
.trow{
  display:flex;align-items:center;gap:14px;padding:var(--row-pad) 14px;
  position:relative;border-radius:var(--r-md);
  transition:background var(--dur-fast) var(--ease);
  content-visibility:auto;contain-intrinsic-size:auto var(--row-h);
}
.trow:active{background:rgba(255,255,255,.08)}
.trow.sel{background:rgba(255,255,255,.14)}
.trow.playing .t1{color:var(--accent)}
.trow.playing .art::after{
  content:"";position:absolute;inset:0;border-radius:inherit;
  border:2px solid var(--accent);box-shadow:0 0 12px color-mix(in srgb,var(--accent) 50%,transparent);
}
.art{
  width:var(--row-art);height:var(--row-art);border-radius:16px;flex:0 0 auto;position:relative;
  background:var(--surface-2) center/cover no-repeat;overflow:hidden;
  box-shadow:0 3px 10px rgba(0,0,0,.45);
}
.art.sm{width:52px;height:52px;border-radius:13px}
.art .ph{width:100%;height:100%;display:grid;place-items:center;opacity:.28;color:var(--accent)}
.art .ph svg{width:50%;height:50%}
.tmeta{min-width:0;flex:1}
.t1{font-size:calc(17px * var(--font-scale));font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t2{font-size:calc(14px * var(--font-scale));color:var(--txt-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.t3{font-size:12.5px;color:var(--txt-dim);margin-top:3px;display:flex;align-items:center;gap:5px;opacity:.85}
.t3 svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2}
.eqbars{display:inline-flex;gap:2px;align-items:flex-end;height:14px;margin-left:auto;padding-left:8px}
.eqbars i{width:3px;background:var(--accent);border-radius:2px;animation:eqb .9s ease-in-out infinite alternate}
.eqbars i:nth-child(2){animation-delay:.18s}
.eqbars i:nth-child(3){animation-delay:.36s}
@keyframes eqb{from{height:3px}to{height:14px}}
@keyframes artIn{
  from{opacity:0;transform:translateX(var(--art-from,36px)) scale(.985)}
  to{opacity:1;transform:none}
}
.artcard.anim{animation:artIn .36s var(--ease-out)}
@keyframes popIn{from{transform:scale(.72);opacity:.35}to{transform:scale(1);opacity:1}}
#btn-play.pop svg,#mini-play.pop svg{animation:popIn .22s var(--ease-out)}
body.paused .eqbars i{animation-play-state:paused}

/* alphabet scrubber */
.alpha{
  position:absolute;right:1px;top:64px;bottom:calc(var(--nav-h) + var(--safe-b) + 84px);
  width:26px;display:flex;flex-direction:column;justify-content:center;
  align-items:center;font-size:10.5px;color:var(--txt-dim);z-index:6;
  touch-action:none;
}
.alpha span{line-height:1.06;pointer-events:none}
.alpha.active{color:var(--accent)}
.alphabubble{
  position:absolute;right:38px;width:66px;height:66px;border-radius:50%;
  background:var(--surface-2);display:grid;place-items:center;font-size:30px;
  box-shadow:var(--shadow);opacity:0;transform:scale(.6);pointer-events:none;
  transition:opacity var(--dur-fast) var(--ease),transform var(--dur-fast) var(--ease);z-index:7;
}
.alphabubble.on{opacity:1;transform:scale(1)}

/* floating action row on lists */
.fabrow{
  position:absolute;left:0;right:0;
  bottom:calc(var(--nav-h) + var(--safe-b) + 124px);
  display:flex;justify-content:center;gap:8px;z-index:5;pointer-events:none;
}
.fabrow.top{position:static;justify-content:flex-start;padding:0 14px 8px;bottom:auto;pointer-events:auto}
.fab{
  pointer-events:auto;height:44px;min-width:44px;padding:0 16px;border-radius:22px;
  background:var(--chip);border:1.4px solid var(--line);
  display:flex;align-items:center;justify-content:center;gap:7px;font-size:14px;
  box-shadow:0 4px 14px rgba(0,0,0,.4);
  transition:transform var(--dur-fast) var(--ease),background var(--dur-fast) var(--ease);
}
.fab:active{transform:scale(.93);background:var(--chip-hi)}
.fab svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.fab.on{background:var(--accent);color:var(--onaccent,#1a1512)}

/* chips */
.chips{display:flex;gap:8px;padding:6px 14px 10px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;padding:8px 16px;border-radius:20px;background:var(--chip);
  font-size:14px;border:1.4px solid transparent;transition:all var(--dur-fast) var(--ease);
}
.chip.on{background:var(--accent);color:var(--onaccent,#1a1512)}
.chip:active{transform:scale(.95)}

/* ============================ PLAYER SCREEN ============================ */
#sc-player{padding-top:0}
.player-wrap{flex:1;display:flex;flex-direction:column;padding:calc(var(--safe-t) + 6px) 12px 0;min-height:0}
.artstage{
  position:relative;
  flex:1 1 auto;align-self:center;
  aspect-ratio:1/1;width:auto;max-width:100%;
  /* never taller than it is wide, so the cover is square and uncropped;
     it takes the full width whenever the screen allows */
  max-height:calc((100vw - 24px) * var(--art-scale,1));
  min-height:120px;
  margin:2px auto 10px;
  border-radius:var(--card-r);overflow:hidden;
  touch-action:none;
}
/* everything below the art is fixed height - only the art and the
   transport give up space, so the text can never be crushed */
.titlepill,.subpill,.togglerow,.seekrow,.outinfo{flex:0 0 auto}
.artcard{
  position:absolute;inset:0;border-radius:var(--card-r);overflow:hidden;
  background:var(--surface-2) center/cover no-repeat;
  box-shadow:0 18px 44px rgba(0,0,0,.5);
  will-change:transform,opacity;
}
.artcard.ghost{opacity:0}
.artstage .ph{position:absolute;inset:0;display:grid;place-items:center;opacity:.22;color:var(--accent)}
.artstage .ph svg{width:34%;height:34%}
.artcta{
  position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:12px;text-align:center;padding:22px;
}
.artcta[hidden]{display:none}
body.empty-lib .rate,body.empty-lib .artstage .ph,body.empty-lib .artcast{display:none}
.artcta .ctatext{font-size:18px}
.artcta .ctahint{font-size:12.5px;color:var(--txt-dim);max-width:230px;line-height:1.45}
.art-ov{position:absolute;inset:0;pointer-events:none}
.art-ov > *{pointer-events:auto}
.rate{position:absolute;left:10px;bottom:10px;display:flex;gap:8px}
.rate button,.artmore{
  width:46px;height:40px;border-radius:20px;background:rgba(12,10,9,.72);
  display:grid;place-items:center;
  transition:transform var(--dur-fast) var(--ease),background var(--dur-fast) var(--ease);
}
.rate button:active,.artmore:active{transform:scale(.9)}
.rate button.on{background:var(--accent);color:var(--onaccent,#17120f)}
.rate button svg,.artmore svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}
.artmore{position:absolute;right:10px;bottom:10px;width:44px}
.artcast{position:absolute;right:12px;top:12px;opacity:.75}
.artcast svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2}

.titlepill{
  align-self:flex-start;max-width:100%;
  background:var(--chip);border-radius:16px;padding:7px 16px;margin:0 0 7px;
  font-size:calc(24px * var(--font-scale));font-weight:800;letter-spacing:-.4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  
}
.subpill{
  align-self:flex-start;max-width:100%;
  background:var(--chip);border-radius:14px;padding:6px 14px;margin-bottom:12px;
  font-size:calc(15px * var(--font-scale));color:var(--txt-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  
}
.ctrlstack{display:flex;flex-direction:column;flex:0 0 auto;position:relative;z-index:2;min-width:0}
.togglerow{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex:0 0 auto}
.tgl{
  height:clamp(34px,5vh,42px);min-width:54px;padding:0 14px;border-radius:15px;background:var(--chip);
  display:grid;place-items:center;
  transition:transform var(--dur-fast) var(--ease),background var(--dur-fast) var(--ease),color var(--dur-fast) var(--ease);
}
.tgl:active{transform:scale(.93)}
.tgl.on{background:var(--accent);color:var(--onaccent,#17120f)}
.tgl svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.togglerow .sp{flex:1}
.tgl .badge{position:absolute;font-size:9px;transform:translate(16px,-13px);background:var(--accent);color:#000;border-radius:8px;padding:0 4px}

/* transport + viz */
.transport{position:relative;flex:1 1 auto;height:auto;min-height:calc(var(--btn-lg,96px) + 18px);display:flex;align-items:center;justify-content:center;touch-action:none}
#viz{position:absolute;inset:0;width:100%;height:100%;opacity:.9}
.ctrls{position:relative;display:flex;align-items:center;justify-content:center;gap:6px;width:100%}
.cbtn{
  border-radius:50%;background:rgba(14,11,10,.8);display:grid;place-items:center;
  
  transition:transform 120ms var(--ease),background var(--dur-fast) var(--ease);
}
.cbtn:active{transform:scale(.88)}
.cbtn svg{stroke:none;fill:currentColor}
.cbtn.xs{width:var(--btn-xs,clamp(40px,6.2vh,52px));height:var(--btn-xs,clamp(40px,6.2vh,52px));opacity:.4}
.cbtn.xs svg{width:46%;height:46%}
.cbtn.sm{width:var(--btn-sm,clamp(54px,8.4vh,70px));height:var(--btn-sm,clamp(54px,8.4vh,70px))}
.cbtn.sm svg{width:43%;height:43%}
.cbtn.lg{width:var(--btn-lg,clamp(84px,12.4vh,104px));height:var(--btn-lg,clamp(84px,12.4vh,104px))}
.cbtn.lg svg{width:42%;height:42%}
.seekrow{
  display:flex;align-items:center;gap:9px;padding:clamp(2px,.8vh,7px) 4px 2px;
  touch-action:none;flex:0 0 auto;
}
.seekrow .seek{flex:1;min-width:0}
.timepill{
  background:var(--chip);border-radius:11px;padding:3px 9px;font-size:12.5px;
  min-width:44px;text-align:center;font-variant-numeric:tabular-nums;flex:0 0 auto;
}
body.no-times .timepill{display:none}
.seek{height:22px;position:relative;display:flex;align-items:center}
.seek .rail{height:6px;width:100%;border-radius:6px;background:rgba(255,255,255,.22);overflow:hidden}
.seek .fill{height:100%;background:var(--accent);border-radius:6px;width:0%;transition:width 120ms linear;box-shadow:0 0 8px color-mix(in srgb,var(--accent) 45%,transparent)}
.seek .buf{position:absolute;height:5px;background:rgba(255,255,255,.12);border-radius:5px}
.seek .knob{
  position:absolute;width:17px;height:17px;border-radius:50%;background:var(--accent);border:2px solid rgba(0,0,0,.25);
  transform:translateX(-50%) scale(1);box-shadow:0 2px 8px rgba(0,0,0,.5);
  transition:transform var(--dur-fast) var(--ease);
}
.seek.drag .knob{transform:translateX(-50%) scale(1.5)}
.seek.drag .fill{transition:none}
.outinfo{
  display:flex;align-items:center;justify-content:center;gap:7px;
  font-size:11.5px;letter-spacing:1.1px;color:var(--txt-dim);
  padding:2px 0 6px;text-transform:uppercase;min-height:clamp(18px,2.8vh,26px);
}
.outinfo svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}
body.fadedctrls .ctrls,body.fadedctrls .titlepill,body.fadedctrls .subpill,
body.fadedctrls .togglerow,body.fadedctrls .outinfo,body.fadedctrls .seekrow{
  opacity:var(--faded-op,.5);transition:opacity var(--dur-slow) var(--ease);
}
body.fadedctrls.viz-art .artstage{opacity:var(--track-op,.25)}

/* ---------------------- player layout presets ---------------------- */
/* CLASSIC - the controls slide over the lower edge of the cover by however
   many pixels the cover needs to reach full width (see fitPlayer) */
body.layout-classic.__unused .ctrlstack{
  margin-top:calc(-1 * var(--stack-overlap,0px));

  background:linear-gradient(to bottom,transparent 0%,
    color-mix(in srgb,var(--bg0) 78%,transparent) 46%, var(--bg0) 92%);
}

/* IMMERSIVE - the cover is the screen, controls float over its lower edge */
body.layout-immersive .player-wrap{padding-left:0;padding-right:0}
body.layout-immersive .artstage{
  width:100%;max-width:none;margin:0;border-radius:0;
  max-height:calc(100vw * var(--art-scale,1));
}
body.layout-immersive .ctrlstack{
  flex:1 1 auto;justify-content:space-between;
  margin-top:calc(-1 * clamp(120px,20vh,220px));
  padding:clamp(40px,7vh,80px) 12px 4px;
  background:linear-gradient(to bottom,transparent 0%,
    color-mix(in srgb,var(--bg0) 70%,transparent) 34%,
    color-mix(in srgb,var(--bg0) 94%,transparent) 62%, var(--bg0) 100%);
}
body.layout-immersive .titlepill,body.layout-immersive .subpill{background:transparent;padding-left:2px}
body.layout-immersive .rate,body.has-overlap .rate{top:12px;bottom:auto}
body.layout-immersive .artmore,body.has-overlap .artmore{top:12px;bottom:auto}
body.layout-immersive .transport{min-height:calc(var(--btn-lg,96px) + 10px)}
body.layout-immersive .outinfo{display:none}

/* COMPACT - smaller cover, denser rows, a big visualiser panel */
body.layout-compact .artstage{max-height:calc((100vw - 24px) * .72 * var(--art-scale,1))}
body.layout-compact .titlepill{min-height:34px;font-size:calc(20px * var(--font-scale))}
body.layout-compact .subpill{min-height:24px;font-size:calc(13px * var(--font-scale))}
body.layout-compact .transport{min-height:max(calc(var(--btn-lg,96px) + 14px), clamp(120px,22vh,260px))}

/* MINIMAL - cover, title, three controls, nothing else */

body.layout-minimal .titlepill{background:transparent;padding-left:2px;font-size:calc(22px * var(--font-scale))}
body.layout-minimal .transport{min-height:calc(var(--btn-lg,96px) + 12px)}

/* ============================ MINI PLAYER ============================ */
#mini{
  position:fixed;left:12px;right:12px;

  padding:8px 10px 12px;display:flex;flex-direction:column;gap:8px;

          <div class="rate">
            <button id="rate-up" data-ic="thumbup" aria-label="Like"></button>
            <button id="rate-down" data-ic="thumbdown" aria-label="Dislike"></button>
          </div>
          <button class="artmore" id="art-more" data-ic="more" aria-label="Track menu"></button>
          <div class="artcast" data-ic="cast"></div>
        </div>
      </div>
      <div class="ctrlstack">
      <div class="titlepill" id="p-title">Nothing playing</div>
      <div class="subpill" id="p-sub">Add music to get started</div>
      <div class="togglerow">
        <button class="tgl" id="t-viz" data-ic="viz" aria-label="Visualization"></button>
        <button class="tgl" id="t-timer" data-ic="clock" aria-label="Sleep timer"></button>
        <div class="sp"></div>
        <button class="tgl" id="t-repeat" data-ic="repeat" aria-label="Repeat"></button>
        <button class="tgl" id="t-shuffle" data-ic="shuffle" aria-label="Shuffle"></button>
      </div>
      <div class="transport" id="transport">
        <canvas id="viz"></canvas>
        <div class="ctrls">
          <button class="cbtn xs" data-act="rew" data-ic="rew"></button>
          <button class="cbtn sm" data-act="prev" data-ic="prev"></button>
          <button class="cbtn lg" id="btn-play" data-ic="play"></button>
          <button class="cbtn sm" data-act="next" data-ic="next"></button>
          <button class="cbtn xs" data-act="ff" data-ic="ff"></button>
        </div>
      </div>
      <div class="seekrow">
        <div class="timepill" id="t-cur">0:00</div>
        <div class="seek" id="seek">
          <div class="rail"><div class="fill" id="seek-fill"></div></div>
          <div class="knob" id="seek-knob" style="left:0%"></div>
        </div>
        <div class="timepill" id="t-dur">0:00</div>
      </div>
      <div class="outinfo" id="outinfo"><span data-ic="speaker"></span><span id="outinfo-txt">NO OUTPUT</span></div>
      </div>
    </div>
  </section>

  <!-- ============ LIBRARY ============ -->
  <section id="sc-library" class="screen" hidden>
    <div class="topbar">
      <h1>Library</h1>
      <button class="iconbtn ring" id="lib-more" data-ic="more"></button>
    </div>
    <div id="dc-banner" class="banner"></div>
    <div id="reconnect" class="banner" hidden></div>
    <div id="bgtask" class="banner" hidden></div>
    <div class="scroll" id="lib-cats"></div>
  </section>

  <!-- ============ LIST ============ -->
  <section id="sc-list" class="screen" hidden>
    <div class="topbar sub">
      <button class="iconbtn" id="list-back" data-ic="back"></button>
      <h1 id="list-title">List</h1>
      <button class="iconbtn" id="list-search" data-ic="search"></button>
      <button class="iconbtn ring" id="list-more" data-ic="more"></button>
    </div>
    <div class="scroll" id="list-body"></div>
    <div class="alpha" id="alpha"></div>
    <div class="alphabubble" id="alphabubble"></div>
    <div class="fabrow" id="list-fabs"></div>
  </section>

  <!-- ============ EQUALIZER ============ -->
  <section id="sc-eq" class="screen" hidden>
    <div class="scroll">
      <div class="eqtop">
        <div class="eqtabs">
          <button data-eqtab="eq" class="on" data-ic="eq-tab"></button>
          <button data-eqtab="vol" data-ic="volume-tab"></button>
          <button data-eqtab="tone" data-ic="reverb-tab"></button>
        </div>
      </div>
      <div class="eqbody">
        <div class="bands" id="bands"></div>
      </div>
      <canvas id="curve"></canvas>
      <div class="eqstat" id="eqstat">NO DVC EQ PARAM 10 TON LMT</div>
      <div class="eqfoot">
        <div style="display:flex;gap:12px;align-items:flex-start">
          <div class="eqmodes">
            <button class="eqmode on" id="m-equ">Equ</button>
            <button class="eqmode" id="m-tone">Tone</button>
            <button class="eqmode on" id="m-lim">Limit</button>
          </div>
          <div style="flex:1">
            <div class="presetbar">
              <div class="presetsel" id="preset-sel">Manual</div>
              <button class="iconbtn ring" id="preset-more" data-ic="more"></button>
            </div>
            <div class="tonerow">
              <div class="tonecell">
                <div class="lbls">Bass<span id="bass-v">0%</span></div>
                <div class="knob" id="k-bass" data-min="-1" data-max="1"><i></i></div>
              </div>
              <div class="tonecell">
                <div class="lbls">Treble<span id="treble-v">0%</span></div>
                <div class="knob" id="k-treble" data-min="-1" data-max="1"><i></i></div>
              </div>
            </div>
            <div class="slidebox eq-volume-shortcut" style="padding:0 0 10px">
              <div class="v">Volume <span id="vol-v">100%</span></div>
              <input type="range" class="accent" id="vol-range" min="0" max="100" value="100">
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- ============ SEARCH ============ -->
  <section id="sc-search" class="screen" hidden>
    <div class="topbar">
      <div style="flex:1;display:flex;align-items:center;gap:8px;background:var(--chip);border-radius:26px;padding:6px 12px">
        <span data-ic="search" style="display:grid;place-items:center;opacity:.7"></span>
        <input id="q" class="field" placeholder="Search" style="border:0;background:transparent;padding:6px 0" autocomplete="off">
        <button class="iconbtn" id="q-clear" data-ic="close" style="width:34px;height:34px"></button>
      </div>
    </div>
    <div class="chips" id="q-chips"></div>
    <div class="scroll" id="q-body"></div>
  </section>

  <!-- ============ SETTINGS ============ -->
  <section id="sc-settings" class="screen" hidden>
    <div class="topbar sub">
      <button class="iconbtn" id="set-back" data-ic="back"></button>
      <h1 id="set-title">Settings</h1>
      <button class="iconbtn" id="set-close" data-ic="close"></button>
    </div>
    <div class="scroll" id="set-body"></div>
  </section>

</div>

<!-- ============ MINI PLAYER + NAV ============ -->
<div id="mini" hidden>
  <div class="mini-main">
    <div class="art sm" id="mini-art"><div class="ph" data-ic="note"></div></div>
    <div class="tmeta">
      <div class="t1" id="mini-title">Nothing playing</div>
      <div class="t2" id="mini-sub"></div>
    </div>
    <button class="mini-play" id="mini-play" data-ic="play"></button>
  </div>
  <div class="mini-seek" id="mini-seek"><div class="fill" id="mini-fill"></div></div>
</div>

<nav id="nav">
  <button data-nav="library" data-ic="nav-lib"></button>
  <button data-nav="eq" data-ic="nav-eq"></button>
  <button data-nav="search" data-ic="nav-search"></button>
  <button data-nav="menu" data-ic="nav-menu"></button>
</nav>

<!-- ============ OVERLAYS ============ -->
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>
<div class="sheet bottom" id="bsheet"></div>
<div id="toast"></div>
<div id="drop">Drop music files or folders to add them to your library</div>
<div id="vizfull"><canvas id="vizc"></canvas><button id="viz-mode-exit" aria-label="Disable visualization" data-ic="viz"></button><div class="vizhud" id="vizhud"></div></div>
<div id="selection-panel" class="selection-panel" role="region" aria-label="Selected tracks" hidden></div>

<input type="file" id="pick-files" multiple accept="audio/*,.mp3,.m4a,.aac,.flac,.wav,.ogg,.oga,.opus,.weba,.webm,.m4b,.aif,.aiff,.wma,.mp4,.3gp,.caf,.mka,.jpg,.jpeg,.png,.webp,.zip" hidden>
<input type="file" id="pick-dir" webkitdirectory directory multiple hidden>
<input type="file" id="pick-img" accept="image/*" hidden>
<input type="file" id="pick-zip" accept=".zip,application/zip" multiple hidden>
<input type="file" id="pick-json" accept=".json,application/json" hidden>
<script src="./player.js?v=drive-source-r12"></script>
</body>
</html>
