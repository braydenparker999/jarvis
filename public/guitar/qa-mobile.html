<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Guitar mobile QA</title><style>body{background:#303033;color:white;font:16px system-ui}button{padding:10px;margin:4px}iframe{display:block;width:390px;height:844px;border:0;margin-top:12px}</style><h1>Galaxy A15 layout · 390 × 844</h1><button id="page">Fail next song page</button><button id="revision">Fail next revision</button><button id="render">Fail next render</button><button id="large">200% text</button><p id="checks"></p><iframe id="phone" title="Jarvis at phone size" src="/guitar/"></iframe><script>
const frame=document.querySelector('iframe');let fail='';
for(const id of ['page','revision','render'])document.getElementById(id).onclick=()=>{fail=id;document.getElementById('checks').textContent='Armed: '+id;};
frame.onload=()=>{const w=frame.contentWindow;const fetcher=w.fetch.bind(w);w.fetch=(url,opts)=>{const str=String(url);if((fail==='page'&&/guitar\/songs\/\d+$/.test(str))||(fail==='revision'&&str.includes('/score?'))){fail='';return Promise.resolve(new w.Response(JSON.stringify({error:"Couldn't generate this tab. Try another Songsterr version."}),{status:502,headers:{'Content-Type':'application/json'}}));}return fetcher(url,opts);};const Worker=w.Worker;w.Worker=function(...args){const worker=new Worker(...args);const post=worker.postMessage.bind(worker);worker.postMessage=(data)=>{if(fail==='render'){fail='';post({meta:{},revisions:[]});}else post(data);};return worker;};};
document.getElementById('large').onclick=()=>{const w=frame.contentWindow;const style=w.document.createElement('style');style.textContent='main,main input,main button,main p,main small,main span,main strong{font-size:200%!important;line-height:1.35!important}';w.document.head.append(style);};
setInterval(()=>{const d=frame.contentDocument;if(d)document.getElementById('checks').textContent='Viewport '+d.documentElement.clientWidth+' · content '+d.documentElement.scrollWidth+' · '+(d.querySelector('#status')?.textContent||'');},1000);
</script>
