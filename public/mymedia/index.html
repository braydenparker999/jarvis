<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101113">
  <meta name="mymedia-release" content="0.36.0">
  <title>My Media · Jarvis</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/assets/shell.css">
  <link rel="stylesheet" href="/mymedia/mymedia.css?v=0.36.0">
  <link rel="stylesheet" href="/assets/premium.css?v=20261003">
  <script type="module" src="/mymedia/app.js?v=0.36.0"></script>
</head>
<body class="module-page media-page">
  <div class="workspace mymedia">
    <header class="topbar">
      <a class="icon-button" id="back" href="/" aria-label="Back to Jarvis" data-icon="back"></a>
      <span class="brand" id="heading">My Media</span>
      <button class="icon-button" id="search-toggle" type="button" aria-label="Search videos" data-icon="search"></button>
      <button class="icon-button" id="refresh" type="button" aria-label="Refresh library" data-icon="refresh"></button>
    </header>

    <main id="library-view">
      <div class="library-title"><h1 id="view-title">Explore</h1><button id="surprise" class="text-button" type="button">Surprise me</button></div>
      <div class="library-tools" id="library-search" hidden>
        <label class="sr-only" for="search">Search videos</label>
        <input id="search" type="search" placeholder="Search videos" autocomplete="off">
        <label class="sr-only" for="sort">Sort videos</label>
        <select id="sort">
          <option value="newest">Newest</option>
          <option value="title">Title</option>
          <option value="longest">Longest</option>
        </select>
      </div>
      <div class="discovery-filters" aria-label="Browse filters"><button id="time-filter" type="button">Any length</button><button id="unwatched-filter" type="button" aria-pressed="false">Unwatched</button><button id="browse-all" type="button" hidden>Clear collection</button></div>
      <p id="status" class="status" role="status">Loading your videos…</p>
      <div id="folder-actions" class="folder-actions" hidden>
        <span id="folder-count"></span>
        <button id="toggle-folders" type="button">Open all folders</button>
      </div>
      <div id="sections"></div>
      <section id="continue" class="shelf" aria-labelledby="continue-label" hidden>
        <div class="section-heading"><h2 id="continue-label">Pick up where you left off</h2></div>
        <div class="video-grid" id="continue-grid"></div>
      </section>
      <button id="load-more" class="secondary" type="button" hidden>Show more</button>
    </main>

    <main id="player-view" hidden>
      <div class="stage">
        <video id="video" controls playsinline preload="metadata"></video>
      </div>
      <div class="watch-body">
        <h1 id="video-title"></h1>
        <p class="watch-meta" id="video-meta"></p>
        <p id="player-status" class="status" role="status" hidden></p>
        <div class="player-tools" role="toolbar" aria-label="Playback">
          <button type="button" id="back-10" aria-label="Back 10 seconds">−10s</button>
          <button type="button" id="forward-10" aria-label="Forward 10 seconds">+10s</button>
          <label class="sr-only" for="speed">Playback speed</label>
          <select id="speed">
            <option value="0.75">0.75×</option>
            <option value="1">1×</option>
            <option value="1.25">1.25×</option>
            <option value="1.5">1.5×</option>
            <option value="1.75">1.75×</option>
            <option value="2">2×</option>
          </select>
          <label class="sr-only" for="captions">Subtitles</label>
          <select id="captions" hidden></select>
          <button type="button" id="pip" hidden>Picture in picture</button>
          <button type="button" id="save-video">Save for later</button>
          <button type="button" id="queue-video">Add to queue</button>
          <button type="button" id="watched" aria-pressed="false">Mark watched</button>
        </div>
        <section class="shelf" aria-labelledby="next-label">
          <h2 class="eyebrow" id="next-label">Up next</h2>
          <div class="next-list" id="next-list"></div>
        </section>
      </div>
    </main>
    <nav class="media-nav" id="media-nav" aria-label="Media navigation"><a href="#explore" data-view="explore" aria-current="page"><span data-icon="search"></span><span>Explore</span></a><a href="#library" data-view="library"><span data-icon="library"></span><span>Library</span></a><a href="#saved" data-view="saved"><span data-icon="bookmark"></span><span>Saved</span></a></nav>
  </div>
  <noscript><p>Enable JavaScript to use My Media.</p></noscript>
</body>
</html>
