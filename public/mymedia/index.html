<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101113">
  <meta name="mymedia-release" content="0.35.0">
  <title>My Media · Jarvis</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/assets/shell.css">
  <link rel="stylesheet" href="/mymedia/mymedia.css?v=0.35.0">
  <script type="module" src="/mymedia/app.js?v=0.35.0"></script>
</head>
<body>
  <div class="workspace mymedia">
    <header class="topbar">
      <a class="text-button" id="back" href="/" aria-label="Back to Jarvis">← Jarvis</a>
      <span class="brand" id="heading">My Media</span>
      <button class="text-button" id="refresh" type="button">Refresh</button>
    </header>

    <main id="library-view">
      <div class="library-tools">
        <label class="sr-only" for="search">Search videos</label>
        <input id="search" type="search" placeholder="Search videos" autocomplete="off">
        <label class="sr-only" for="sort">Sort videos</label>
        <select id="sort">
          <option value="newest">Newest</option>
          <option value="title">Title</option>
          <option value="longest">Longest</option>
        </select>
      </div>
      <p id="status" class="status" role="status">Loading your videos…</p>
      <div id="folder-actions" class="folder-actions" hidden>
        <span id="folder-count"></span>
        <button id="toggle-folders" type="button">Open all folders</button>
      </div>
      <section id="continue" class="shelf" aria-labelledby="continue-label" hidden>
        <h2 class="eyebrow" id="continue-label">Continue watching</h2>
        <div class="video-grid" id="continue-grid"></div>
      </section>
      <div id="sections"></div>
    </main>

    <main id="player-view" hidden>
      <div class="stage">
        <video id="video" controls playsinline preload="metadata"></video>
      </div>
      <div class="watch-body">
        <h1 id="video-title"></h1>
        <p class="watch-meta" id="video-meta"></p>
        <p id="player-status" class="status" role="status" hidden></p>
        <div class="player-tools" role="toolbar" aria-label="Playback">
          <button type="button" id="back-10" aria-label="Back 10 seconds">−10s</button>
          <button type="button" id="forward-10" aria-label="Forward 10 seconds">+10s</button>
          <label class="sr-only" for="speed">Playback speed</label>
          <select id="speed">
            <option value="0.75">0.75×</option>
            <option value="1">1×</option>
            <option value="1.25">1.25×</option>
            <option value="1.5">1.5×</option>
            <option value="1.75">1.75×</option>
            <option value="2">2×</option>
          </select>
          <label class="sr-only" for="captions">Subtitles</label>
          <select id="captions" hidden></select>
          <button type="button" id="pip" hidden>Picture in picture</button>
          <button type="button" id="watched" aria-pressed="false">Mark watched</button>
        </div>
        <section class="shelf" aria-labelledby="next-label">
          <h2 class="eyebrow" id="next-label">Up next</h2>
          <div class="next-list" id="next-list"></div>
        </section>
      </div>
    </main>
  </div>
  <noscript><p>Enable JavaScript to use My Media.</p></noscript>
</body>
</html>
