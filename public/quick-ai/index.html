<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#101112"><title>Quick AI · Jarvis</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/assets/shell.css"><link rel="stylesheet" href="/assets/quick-ai.css"><link rel="stylesheet" href="/assets/premium.css?v=20261003"><script type="module" src="/assets/quick-ai.js"></script></head>
<body class="module-page conversation-page quick-page"><div class="workspace quick-ai">
<header class="topbar"><a class="icon-button" href="/" aria-label="Back to Jarvis" data-icon="back"></a><span class="brand">Quick AI</span><label class="sr-only" for="model">Model</label><select id="model" aria-label="Choose model"><option value="gemini">Gemini</option><option value="qwen">Qwen</option></select><button class="icon-button" id="chat-drawer" aria-label="Saved conversations" data-icon="chat"></button><button class="icon-button" id="quick-menu" aria-label="Chat menu" data-icon="more"></button><button id="new-chat" hidden>New chat</button></header>
<main id="content"><section id="messages" aria-label="Conversation" aria-busy="false"></section><button id="new-reply" class="new-messages" type="button" hidden>New reply</button><p id="storage-status" role="status" class="warning" hidden></p></main>
<form id="composer" class="ai-composer"><div id="previews" class="previews"></div><div id="search-row" hidden><label class="sr-only" for="query">Search query</label><input id="query" maxlength="350" placeholder="Search query"></div><label class="sr-only" for="prompt">Message Quick AI</label><textarea id="prompt" rows="1" maxlength="16000" placeholder="Ask anything…"></textarea>
<div class="send-row"><label class="attach icon-button" for="image" aria-label="Attach image" data-icon="image"></label><input id="image" type="file" accept="image/jpeg,image/png,image/webp" multiple hidden><label class="search-switch" title="Search the web"><input type="checkbox" id="search">Search</label><span id="status" role="status">Checking…</span><button class="text-button" type="button" id="retry" hidden>Retry</button><button class="text-button" type="button" id="switch-retry" hidden>Use Qwen</button><button class="text-button" type="button" id="stop" hidden>Stop</button><button class="primary send-icon" id="send" disabled aria-label="Send message" data-icon="send"></button></div></form>
</div>
<dialog id="history-dialog" class="app-sheet" aria-labelledby="history-heading"><div class="dialog-heading"><h2 id="history-heading">Conversations</h2><button class="icon-button" data-close="history-dialog" aria-label="Close" data-icon="close"></button></div><button class="sheet-action" id="drawer-new" type="button">New conversation</button><div id="chat-list"></div><label class="sr-only" for="history">Saved chats</label><select id="history" hidden></select><button id="delete-chat" hidden>Delete</button></dialog>
<dialog id="info-dialog" class="app-sheet" aria-labelledby="info-heading"><div class="dialog-heading"><h2 id="info-heading">Chat information</h2><button class="icon-button" data-close="info-dialog" aria-label="Close" data-icon="close"></button></div><p id="usage-summary" aria-label="Usage for this chat"></p><p class="model-note">Chats stay on this device. Messages and images go to the selected provider. Search sends your text query to Tavily. Google’s free API tier permits product improvement use. Switching models sends relevant chat history to the new provider.</p></dialog>
<noscript>Enable JavaScript to use Quick AI.</noscript></body></html>
