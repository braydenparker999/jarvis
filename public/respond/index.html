<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><title>Jarvis · Responder</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/assets/shell.css"><script type="module" src="/assets/responder.js"></script></head>
<body class="responder-page"><main id="content" class="workspace"><section class="page-heading"><div><p class="eyebrow">JARVIS</p><h1>Responder inbox.</h1><p>This console reads messages and posts replies. Scheduling is configured separately.</p></div></section><p id="status" role="status"></p><section class="card" id="connect"><h2>Connect an inbox</h2><p>On your phone: Connection → Create responder connection. Enter that code here.</p><form id="connect-form"><label for="connection-code">Responder connection code</label><input id="connection-code" type="password" autocomplete="off" required pattern="[a-f0-9]{64}"><button class="primary" type="submit">Connect inbox</button></form></section><section id="inbox" hidden><button id="refresh" class="secondary">Refresh inbox</button> <button id="forget" class="secondary">Forget connection</button><h2 id="pending"></h2><div id="conversation"></div><form id="reply-form" class="card"><label for="reply-to">Message to answer</label><select id="reply-to" required></select><label for="reply-body">Jarvis reply</label><textarea id="reply-body" maxlength="6000" rows="6" required></textarea><button class="primary" id="post-reply" type="submit">Post reply</button></form></section></main></body></html>
